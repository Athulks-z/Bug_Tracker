openapi: 3.0.3
info:
  title: TaskTracker Unified Tasks API
  version: 2.0.0
paths:
  /api/projects:
    get:
      summary: List projects visible to the authenticated user
      description: Managers and administrators see all projects. Other roles see projects where they are owner, active member, or stakeholder. Filtering and pagination are applied in the database query.
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
    post:
      summary: Create a project with milestones
      description: Administrator access is required. The selected owner is automatically included as a project member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
  /api/projects/{id}:
    get:
      summary: Get visible project details and progress
      description: Returns project metadata, ordered milestone progress, visible task distribution, and project backlog. Progress excludes backlog and Rejected tasks.
    put:
      summary: Update project metadata and milestones
  /api/projects/{id}/backlog:
    get:
      summary: List backlog items for a visible project
  /api/projects/{id}/backlog/{taskId}/move:
    post:
      summary: Move a backlog item to active Tasks
      description: Requires an assignee, start date, and due date. The move is recorded before assignment email is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee, startDate, dueDate]
              properties:
                assignee:
                  type: string
                startDate:
                  type: string
                  format: date
                dueDate:
                  type: string
                  format: date
                milestone:
                  type: string
                  nullable: true
                estimatedHours:
                  type: number
                  minimum: 0
  /api/tasks:
    get:
      summary: List tasks
      description: Employee and trainee results are restricted to tasks assigned to the authenticated user. Manager and administrator results include all tasks. Each task includes its stable taskKey display identifier.
      parameters:
        - in: query
          name: type
          schema:
            type: array
            items:
              type: string
        - in: query
          name: statusGroup
          schema:
            type: string
            enum: [Open, In Progress, Completed/Closed, Rejected]
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: project
          schema:
            type: string
        - in: query
          name: assignee
          description: Repeat for multiple assignees; team roles only.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: customTypeName
          description: Optional exact custom Other type match.
          schema:
            type: string
        - in: query
          name: overdue
          schema:
            type: boolean
        - in: query
          name: dueToday
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
    post:
      summary: Create or assign a task
      description: Any permitted task creator can assign the task to any active user, whether or not that user is a member of the project. The response includes a stable taskKey in PROJECTKEY-N format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
  /api/tasks/stats/count:
    get:
      summary: Count tasks using the same visibility and filters as the task list
  /api/tasks/stats/summary:
    get:
      summary: Count visible tasks by raw status
  /api/tasks/dashboard:
    get:
      summary: Return dashboard aggregates and task lists
      description: All task-linked results use the task visibility rule. Team workload data is returned only to managers and administrators.
  /api/tasks/{id}:
    get:
      summary: Get task detail
      description: Returns 404 when an employee or trainee requests a task assigned to another user. The response includes the stable taskKey display identifier.
    put:
      summary: Update task
      description: Permitted task editors can assign it to any active user, whether or not that user is a member of the project.
  /api/tasks/{id}/attachments:
    post:
      summary: Upload task attachments
  /api/tasks/attachments/{id}/download:
    get:
      summary: Authenticated attachment download restricted by task visibility
  /api/tasks/{id}/reject:
    post:
      summary: Reject task with mandatory closing remarks
  /api/tasks/{id}/reopen:
    post:
      summary: Reopen rejected task
  /api/tasks/{id}/comments:
    post:
      summary: Add task comment
  /api/work-types:
    get:
      summary: List and administer configurable work types
components:
  schemas:
    TaskInput:
      type: object
      required: [title, project, type]
      properties:
        title:
          type: string
        description:
          type: string
          description: Server-sanitized rich HTML
        type:
          type: string
        customTypeName:
          type: string
          maxLength: 100
          nullable: true
        project:
          type: string
        assignee:
          type: string
          description: ID of any active user; project membership is not required.
        status:
          type: string
        priority:
          type: string
        startDate:
          type: string
          format: date
          description: Defaults to today on the server
        milestone:
          type: string
          nullable: true
        mode:
          type: string
          enum: [task, backlog]
          description: backlog explicitly creates a backlog item and suppresses assignment notifications
    Task:
      type: object
      description: Task responses include the stable, human-readable project-scoped identifier.
      properties:
        _id:
          type: string
          description: Internal identifier used by existing API routes and references.
        taskKey:
          type: string
          example: OPS-42
          readOnly: true
          description: Stable display identifier composed from the project key and a per-project sequence number.
        taskNumber:
          type: integer
          readOnly: true
        isBacklog:
          type: boolean
          readOnly: true
    ProjectInput:
      type: object
      required: [name, key, owner, status, priority, members, stakeholders, milestones]
      properties:
        name:
          type: string
        description:
          type: string
        key:
          type: string
        owner:
          type: string
          description: Active user ID; owner is automatically a project member.
        status:
          type: string
          enum: [planning, active, in_progress, on_hold, completed, cancelled]
          description: active is retained as the stored status for In Progress.
        priority:
          type: string
          enum: [High, Medium, Low]
        startDate:
          type: string
          format: date
          nullable: true
        targetEndDate:
          type: string
          format: date
          nullable: true
        members:
          type: array
          items:
            type: string
        stakeholders:
          type: array
          items:
            type: string
        milestones:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name]
            properties:
              id:
                type: string
              name:
                type: string
                maxLength: 100
              dueDate:
                type: string
                format: date
                nullable: true
              owner:
                type: string
                nullable: true
