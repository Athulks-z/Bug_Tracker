openapi: 3.0.3
info:
  title: TaskTracker Unified Tasks API
  version: 2.0.0
paths:
  /api/tasks:
    get:
      summary: List tasks
      description: Employee and trainee results are restricted to tasks assigned to the authenticated user. Manager and administrator results include all tasks.
      parameters:
        - in: query
          name: type
          schema:
            type: array
            items:
              type: string
        - in: query
          name: statusGroup
          schema:
            type: string
            enum: [Open, In Progress, Completed/Closed, Rejected]
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: project
          schema:
            type: string
        - in: query
          name: assignee
          description: Repeat for multiple assignees; team roles only.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: customTypeName
          description: Optional exact custom Other type match.
          schema:
            type: string
        - in: query
          name: overdue
          schema:
            type: boolean
        - in: query
          name: dueToday
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
    post:
      summary: Create or assign a task
      description: Any permitted task creator can assign the task to any active user, whether or not that user is a member of the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
  /api/tasks/stats/count:
    get:
      summary: Count tasks using the same visibility and filters as the task list
  /api/tasks/stats/summary:
    get:
      summary: Count visible tasks by raw status
  /api/tasks/dashboard:
    get:
      summary: Return dashboard aggregates and task lists
      description: All task-linked results use the task visibility rule. Team workload data is returned only to managers and administrators.
  /api/tasks/{id}:
    get:
      summary: Get task detail
      description: Returns 404 when an employee or trainee requests a task assigned to another user.
    put:
      summary: Update task
      description: Permitted task editors can assign it to any active user, whether or not that user is a member of the project.
  /api/tasks/{id}/attachments:
    post:
      summary: Upload task attachments
  /api/tasks/attachments/{id}/download:
    get:
      summary: Authenticated attachment download restricted by task visibility
  /api/tasks/{id}/reject:
    post:
      summary: Reject task with mandatory closing remarks
  /api/tasks/{id}/reopen:
    post:
      summary: Reopen rejected task
  /api/tasks/{id}/comments:
    post:
      summary: Add task comment
  /api/work-types:
    get:
      summary: List and administer configurable work types
components:
  schemas:
    TaskInput:
      type: object
      required: [title, project, type]
      properties:
        title:
          type: string
        description:
          type: string
          description: Server-sanitized rich HTML
        type:
          type: string
        customTypeName:
          type: string
          maxLength: 100
          nullable: true
        project:
          type: string
        assignee:
          type: string
          description: ID of any active user; project membership is not required.
        status:
          type: string
        priority:
          type: string
        startDate:
          type: string
          format: date
          description: Defaults to today on the server
